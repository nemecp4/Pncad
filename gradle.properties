org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Run the Kotlin compiler inside the Gradle daemon (JDK 17/21) instead of a
# separate Kotlin daemon, which auto-launches on the newest installed JDK (25)
# and crashes Kotlin 2.0.21's version parser (IllegalArgumentException: 25.0.x).
kotlin.compiler.execution.strategy=in-process
